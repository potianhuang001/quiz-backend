# Render 一键部署配置（零依赖 Node 服务，单仓库根目录即服务）
# 用法：Render 新建 Blueprint → 连接本仓库 → 选此文件 → Deploy。
services:
  - type: web
    name: quiz-redemption
    runtime: node
    plan: free
    region: oregon          # 免费层可选区域，可改 singapore/frankfurt 等
    branch: master          # 仓库默认分支
    buildCommand: "echo skip-build"
    startCommand: "node server.js"
    healthCheckPath: /stats
    envVars:
      - key: PORT
        sync: false
      - key: NODE_ENV
        value: production
      # 如需小程序微信登录，再补下面两项（在 Render 环境变量里填你的小程序 AppID/Secret）：
      # - key: WX_APPID
      #   sync: false
      # - key: WX_SECRET
      #   sync: false
